<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BritaPRO Product Portal</title><style>body{margin:0;font:16px system-ui,sans-serif;background:#f3f7fb;color:#17334b}header{background:#fff;padding:18px 24px;border-bottom:1px solid #dbe5ed}header a{color:#13668e;text-decoration:none}main{max-width:1050px;margin:auto;padding:32px 18px}h1{margin-bottom:8px}p{color:#60758a}input,select{font:inherit;padding:12px;border:1px solid #c9d7e1;border-radius:9px;max-width:100%}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input{flex:2;min-width:210px}select{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}.card{background:white;border:1px solid #dce5ed;border-radius:13px;padding:18px}.card small{color:#6c8294}.card h3{font-size:17px;margin:10px 0}.card a{display:inline-block;background:#116da3;color:white;text-decoration:none;padding:9px 12px;border-radius:8px}.pending{color:#8a5a20;font-size:13px}#count{margin:15px 0}</style></head><body><header><strong>BritaPRO · Product Portal</strong> <span style="float:right"><a href="https://britaproportal.netlify.app/">Partner Portal</a></span></header><main><h1>Product Resources</h1><p>Browse sales sheets and technical sheets for whole-house and drinking water systems. No partner pricing is displayed.</p><div class="controls"><input id="search" placeholder="Search product or treatment type" aria-label="Search sales sheets"><select id="category"><option value="">All products</option><option>Whole-House</option><option>Drinking Water</option></select></div><p id="count">Loading resources…</p><div class="grid" id="grid"></div></main><script>
let records=[];const $=id=>document.getElementById(id);
function render(){const q=$('search').value.toLowerCase(),cat=$('category').value;const rows=records.filter(r=>(!cat||r.category===cat)&&r.name.toLowerCase().includes(q));$('count').textContent=rows.length+' products listed';$('grid').replaceChildren();for(const r of rows){const box=document.createElement('article');box.className='card';const small=document.createElement('small');small.textContent=r.category;const h=document.createElement('h3');h.textContent=r.name;box.append(small,h);const link=document.createElement('a');link.href='/'+r.path.split('/').map(encodeURIComponent).join('/');link.textContent='View sales sheet (PDF)';link.target='_blank';link.rel='noopener';box.append(link);if(r.techPath){const tech=document.createElement('a');tech.href='/'+r.techPath.split('/').map(encodeURIComponent).join('/');tech.textContent='View technical sheet (PDF)';tech.target='_blank';tech.rel='noopener';tech.style.margin='8px 0 0 8px';box.append(tech)}$('grid').append(box)}}
fetch('/sales-sheets/catalog.json').then(r=>{if(!r.ok)throw Error('Resource index unavailable');return r.json()}).then(data=>{records=data;render()}).catch(e=>{$('count').textContent=e.message});$('search').addEventListener('input',render);$('category').addEventListener('change',render);
</script></body></html>
