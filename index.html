<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BritaPRO Product Portal</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17334b;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px max(20px,calc((100vw - 1120px)/2));border-bottom:1px solid #dbe5ed;display:flex;justify-content:space-between;gap:15px;align-items:center}header a{color:#13668e;text-decoration:none;font-weight:600}main{max-width:1120px;margin:auto;padding:35px 20px 70px}h1{font-size:clamp(28px,4vw,38px);margin:0 0 9px}p{color:#60758a;line-height:1.5}.intro{margin:0 0 27px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:25px 0}.choice{border:1px solid #dce5ed;background:white;border-radius:18px;padding:29px;text-align:left;cursor:pointer;box-shadow:0 5px 18px #14283b08;min-height:210px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:#17334b}.choice:hover,.choice:focus-visible{outline:2px solid #82b5d6}.category-photo{width:100%;height:115px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:4px}.home-photo-group{width:100%;height:170px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:12px;padding:8px}.home-photo-group img{height:100%;min-width:0;max-width:32%;object-fit:contain}.home-photo-group.drinking img{max-width:47%}.home-photo-group img[hidden]{display:none}.choice .symbol{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#e5f3fa;color:#086aa0;font-size:27px}.choice strong{font-size:23px}.choice small{font-size:14px;color:#62798b}.choice .action{margin-top:auto;color:#0b6da5;font-weight:700}.back{border:0;background:none;color:#096caa;font:inherit;font-weight:700;padding:8px 0;cursor:pointer;margin-bottom:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input{font:inherit;padding:12px 14px;border:1px solid #c9d7e1;border-radius:9px;width:100%;max-width:520px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce5ed;border-radius:14px;padding:19px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.product-image{width:100%;height:150px;object-fit:contain;background:white;border:1px solid #e4ebf0;border-radius:10px}.photo-note{font-size:11px;color:#64798a}.placeholder{width:100%;height:150px;border:1px dashed #b8c9d8;border-radius:10px;background:#f4f7fa;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#8293a2;font-size:13px;font-weight:600}.card h3{font-size:17px;line-height:1.35;margin:0 0 6px}.card a{display:block;background:#116da3;color:#fff;text-decoration:none;padding:10px 13px;border-radius:8px;font-size:14px;width:100%;text-align:center}.card a:hover{background:#075a8c}.card a.tech{background:#e9f3f9;color:#075a8c;border:1px solid #bed8e8}.card a.tech:hover{background:#d9ebf6}.count{font-size:14px;color:#62798b;margin:0 0 15px}#section{display:none}@media(max-width:600px){.choices{grid-template-columns:1fr}.choice{min-height:170px;padding:22px}header{font-size:14px}main{padding:25px 16px}}
</style></head><body>
<header><strong>BritaPRO · Product Portal</strong><a href="https://britaproportal.netlify.app/">Partner Portal</a></header>
<main><div id="home"><h1>Product Resources</h1><p class="intro">Select a product category to browse sales sheets and technical specifications. No pricing is displayed.</p>
<div class="choices">
<button class="choice" type="button" data-category="Whole-House"><div class="home-photo-group"><img src="/product-images/BP_TitaniumLT_3_Stage_GREY.png" alt="BritaPRO triple-stage Titanium LT"><img src="/product-images/BP_PlatValve_CatCarbon.png" alt="BritaPRO backwashing filter"><img src="/product-images/BP_Softener.png" alt="BritaPRO softener"></div><strong>Whole-House Systems</strong><small>Water filtration, softeners, specialty treatment, and leak detection.</small><span class="action">Browse Whole-House →</span></button>
<button class="choice" type="button" data-category="Drinking Water"><div class="home-photo-group drinking"><img src="/product-images/BP_RO_Tankless.png" alt="BritaPRO tankless reverse osmosis"><img src="/product-images/BP_SingleStage_14in_PFAS.png" alt="BritaPRO single-stage drinking water filter"></div><strong>Drinking Water Systems</strong><small>Reverse osmosis and single-stage drinking water filtration.</small><span class="action">Browse Drinking Water →</span></button>
</div></div>
<section id="section"><button class="back" type="button" id="back">← All product categories</button><h1 id="heading"></h1><p>Search products and open the corresponding sales or technical sheet.</p><div id="subcategories" class="choices" style="display:none"></div><button id="subBack" class="back" type="button" style="display:none">← Drinking Water or Whole-House categories</button><div class="controls"><input id="search" type="search" placeholder="Search products" aria-label="Search products"></div><p class="count" id="count"></p><div class="grid" id="grid"></div></section>
</main><script>
const $=id=>document.getElementById(id);let records=[],selected='',selectedSub='';const wholeHouseGroups=['Titanium LT','Backwashing Filters','Non-Backwashing Filters (NRV)','Specialty Filters','Water Softeners','Mid-Plates','Mixed-Bed Systems','UV Systems','Other Whole-House Products'];
const categoryPhotoNames={'Titanium LT':'TitaniumLT 3 Stage GREY','Backwashing Filters':'Platinum Valve Catalytic Carbon','Non-Backwashing Filters (NRV)':'Non-backwashing Catalytic Carbon','Specialty Filters':'Platinum Valve PFAS','Water Softeners':'Softener','Mid-Plates':'Softener Carbon Mid-Plate','Mixed-Bed Systems':'Softener Carbon MixedBed','UV Systems':'UV','Other Whole-House Products':'Leak Detection','Reverse Osmosis (RO)':'RO Tankless','Single Stage Filters':'SingleStage 14in PFAS'};
const drinkingWaterGroups=['Reverse Osmosis (RO)','Single Stage Filters'];const names={'Whole-House':'Whole-House Systems','Drinking Water':'Drinking Water Systems'};
function show(category){selected=category;selectedSub='';$('home').style.display=category?'none':'block';$('section').style.display=category?'block':'none';$('search').value='';if(category){$('heading').textContent=names[category];render()}history.replaceState(null,'',category?'#'+(category==='Whole-House'?'whole-house':'drinking-water'):location.pathname)}
function showSub(group){selectedSub=group;$('search').value='';render()}
function render(){const whole=selected==='Whole-House',choose=!!selected&&!selectedSub;const sub=$('subcategories');sub.style.display=choose?'grid':'none';$('subBack').style.display=selectedSub?'block':'none';$('search').parentElement.style.display=choose?'none':'flex';$('heading').textContent=selectedSub||names[selected]||'';if(choose){sub.replaceChildren();for(const group of (whole?wholeHouseGroups:drinkingWaterGroups)){const rows=records.filter(r=>r.category===selected&&r.subcategory===group);if(!rows.length)continue;const b=document.createElement('button');b.className='choice';b.type='button';const representative=records.find(r=>r.category===selected&&r.name===categoryPhotoNames[group])||rows[0];if(representative.imagePath){const img=document.createElement('img');img.className='category-photo';img.alt=group+' BritaPRO product';img.loading='lazy';img.src='/'+representative.imagePath.split('/').map(encodeURIComponent).join('/');img.onerror=()=>img.remove();b.append(img)}const name=document.createElement('strong');name.textContent=group;const count=document.createElement('small');count.textContent=rows.length+' products';const action=document.createElement('span');action.className='action';action.textContent='Browse products →';b.append(name,count,action);b.addEventListener('click',()=>showSub(group));sub.append(b)}$('grid').replaceChildren();$('count').textContent='Choose a product category';return}
const q=$('search').value.trim().toLowerCase();const rows=records.filter(r=>r.category===selected&&r.subcategory===selectedSub&&(!q||r.name.toLowerCase().includes(q)));$('count').textContent=rows.length+' products';$('grid').replaceChildren();for(const r of rows){const box=document.createElement('article');box.className='card';const placeholder=document.createElement('div');placeholder.className='placeholder';placeholder.textContent='BritaPRO product photo coming soon';if(r.imagePath||r.imageSku){const img=document.createElement('img');img.className='product-image';img.alt='BritaPRO '+r.name+' product image';img.loading='lazy';const fallback=r.imageSku?'https://britaproorders.netlify.app/'+encodeURIComponent(r.imageSku)+'.webp':'';img.src=r.imagePath?'/'+r.imagePath.split('/').map(encodeURIComponent).join('/'):fallback;img.onerror=()=>{if(fallback&&img.src!==fallback){img.src=fallback}else{img.replaceWith(placeholder)}};box.append(img)}else{box.append(placeholder)}const h=document.createElement('h3');h.textContent=r.name;box.append(h);for(const [path,label,css] of [[r.path,'View sales sheet (PDF)',''],[r.techPath,'View technical sheet (PDF)','tech'],[r.manualPath,'Installation Manual (PDF)','tech']]){if(!path)continue;const link=document.createElement('a');link.href='/'+path.split('/').map(encodeURIComponent).join('/');link.textContent=label;link.className=css;link.target='_blank';link.rel='noopener';box.append(link)}$('grid').append(box)}}
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.category)));$('back').addEventListener('click',()=>show(''));$('subBack').addEventListener('click',()=>showSub(''));$('search').addEventListener('input',render);
fetch('/sales-sheets/catalog.json').then(r=>{if(!r.ok)throw Error('Unable to load product resources');return r.json()}).then(data=>{records=data;const hash=location.hash.toLowerCase();if(hash==='#whole-house')show('Whole-House');else if(hash==='#drinking-water')show('Drinking Water')}).catch(e=>{document.querySelector('.intro').textContent=e.message});
</script></body></html>
